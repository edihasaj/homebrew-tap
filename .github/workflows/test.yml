name: Test Tap

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      run_native:
        description: Run paid macOS validation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-policy:
    name: native policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node --test scripts/native-ci-policy.test.mjs

  brew-test:
    needs: native-policy
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/production') || (github.event_name == 'pull_request' && github.base_ref == 'production') || (github.event_name == 'workflow_dispatch' && inputs.run_native == true)) }}
    runs-on: macos-latest
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Tap locally
        run: brew tap edihasaj/tap "$PWD"

      - name: Audit casks
        run: |
          shopt -s nullglob
          casks=(Casks/*.rb)
          if [ "${#casks[@]}" -eq 0 ]; then
            echo "No casks yet."
            exit 0
          fi
          for cask in "${casks[@]}"; do
            brew audit --cask --online "edihasaj/tap/$(basename "$cask" .rb)"
          done
